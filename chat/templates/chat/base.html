{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Khidr{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'chat/app.css' %}?v={{ TIME_VERSION }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="/">khidr</a>
    <nav>
      {% if request.session.khidr_logged_in %}
        <a href="/logout/" class="linky">logout</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
